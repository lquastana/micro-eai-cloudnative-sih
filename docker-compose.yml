version: '3.8'
services:
  app:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "2575:2575"
    command: python -m app.main
    depends_on:
      - redis
  worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    command: celery -A app.jobs.tasks.celery_app worker -B --loglevel=info
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  prometheus:
    image: prom/prometheus
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
  loki:
    image: grafana/loki
    profiles: ["monitoring"]
    ports:
      - "3100:3100"
